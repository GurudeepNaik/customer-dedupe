[project]
name = "customer-dedupe"
version = "0.1.0"
description = "Find duplicate customer records, explain why, and build golden records with lineage."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gurudeep Naik" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "phonenumbers>=8.13",
    "jellyfish>=1.1",
    "typer>=0.12",
]

[project.scripts]
dedupe = "customer_dedupe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_dedupe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["customer_dedupe"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jellyfish.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
